# Save this file as: .github/workflows/news-digest.yml in your repo

name: Weekly News Digest

on:
  schedule:
    # Runs at 02:30 UTC every Saturday = 8:00 AM IST every Sunday
    - cron: "30 2 * * 6"
  workflow_dispatch: {}  # lets you manually trigger a test run from GitHub's UI

permissions:
  contents: write  # needed so the workflow can commit digest.txt back to the repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run digest script
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python news_digest.py

      - name: Publish digest.txt back to the repo
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest.txt
          git commit -m "Update weekly digest" || echo "No changes to commit"
          git push
